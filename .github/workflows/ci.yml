name: AnnaChakra CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/annachakra_test
      SECRET_KEY: ci-only-test-secret-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Verify application imports
        run: python -c "from app.main import app; print('Application imported successfully')"

      - name: Verify SQLAlchemy models
        run: python -c "import app.models; from app.core.database import Base; print(list(Base.metadata.tables.keys()))"

      - name: Run backend tests
        run: python -m pytest tests -v

  database:
    name: Database CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: annachakra_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d annachakra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/annachakra_test
      SECRET_KEY: ci-only-test-secret-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration consistency
        run: python -m alembic check

      - name: Verify database connectivity
        run: |
          python -c "from app.core.database import engine; from sqlalchemy import text; connection = engine.connect(); print(connection.execute(text('SELECT 1')).scalar()); connection.close()"

      - name: Verify health endpoint
        run: |
          pip install httpx
          python -c "from fastapi.testclient import TestClient; from app.main import app; response = TestClient(app).get('/health'); assert response.status_code == 200, response.text; print(response.json())"
